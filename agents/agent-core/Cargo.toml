[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"

# Standalone: this crate is the agent's own mutable source tree. The
# orchestrator builds it for wasm32-wasip2 and hot-swaps the result.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
