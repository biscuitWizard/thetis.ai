[workspace]
resolver = "2"
members = ["crates/thetis"]
# Guest crates are built for wasm32-wasip2 by the orchestrator's build pipeline,
# never as part of the host workspace.
exclude = ["agents", "gateways", "tools", "templates"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
