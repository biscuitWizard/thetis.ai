name: retrieval-bench

# Measures skill-retrieval and tool-routing accuracy, appends one datapoint per
# run to the `bench-results` orphan branch, and publishes a chart.
#
# Why an orphan branch: results accumulate forever and are rewritten on every
# run, which is exactly the history nobody wants interleaved with the code's.
# Kept in-repo rather than in artifacts so the series survives the 90-day
# artifact retention and can be read with a plain `git show`.

on:
  push:
    branches: [main, master, public]
    # Only when something that could move a number changes. A benchmark that
    # runs on every unrelated commit produces a flat line with a cost attached,
    # and the chart becomes harder to read rather than more informative.
    paths:
      - 'skills/**'
      - 'crates/thetis/src/skills.rs'
      - 'crates/thetis/src/skill_index.rs'
      - 'crates/thetis/src/skill_lint.rs'
      - 'crates/thetis/src/embeddings.rs'
      - 'agents/agent-core/src/groups.rs'
      - 'scripts/retrieval-bench/**'
      - '.github/workflows/retrieval-bench.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'crates/thetis/src/skills.rs'
      - 'crates/thetis/src/skill_index.rs'
      - 'crates/thetis/src/skill_lint.rs'
      - 'agents/agent-core/src/groups.rs'
      - 'scripts/retrieval-bench/**'
  # Manual runs, for backfilling a range of history in one go.
  workflow_dispatch:
    inputs:
      rev_range:
        description: 'Revisions to measure, e.g. HEAD~20..HEAD (blank = working tree)'
        required: false
        default: ''
      last:
        description: 'Or: measure the last N commits'
        required: false
        default: ''
      lexical:
        description: 'Force the BM25 fallback instead of dense ranking'
        type: boolean
        default: false
      full_ablation:
        description: 'Also ablate the 9.5k-doc ToolRet corpus (downloads it; embedding a cold cache costs ~$0.20-0.90)'
        type: boolean
        default: false

concurrency:
  # Serialise pushes to the results branch: two runs appending at once would
  # have one of them lose its datapoint to a non-fast-forward.
  group: retrieval-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # to push datapoints to bench-results
      pull-requests: write   # to comment the delta on a PR

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: --rev and --last walk it, and a shallow clone would
          # silently reduce a backfill to whatever depth happened to be fetched.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      # The harness lifts only pure source, so this compiles in seconds. Caching
      # it anyway because a backfill run reuses one target dir across every
      # revision, and that is where the saving is largest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: scripts/retrieval-bench -> target
          key: retrieval-bench

      # The vector cache is the real cost control. Keyed on the card text of the
      # corpus, so an unchanged skill is never re-embedded; a run that changes
      # one brief pays for one vector instead of 127.
      - name: Restore the embedding cache
        uses: actions/cache@v4
        with:
          path: bench-work/cache
          # Keyed on the pinned fixture, because that is what gets embedded.
          # Keying it on the live skills/ tree would miss the cache on every
          # unrelated brief edit and re-embed 61 cards for nothing.
          key: retrieval-bench-vectors-${{ hashFiles('scripts/retrieval-bench/corpus/**') }}
          restore-keys: |
            retrieval-bench-vectors-

      - name: Check the pinned corpus for drift
        # Advisory, never fatal. Drift means someone edited a brief without
        # re-pinning, which is fine and often deliberate -- but the run is then
        # measuring a corpus older than the tree, and that belongs in the log
        # rather than being discovered later from a puzzling flat line.
        continue-on-error: true
        run: |
          cd scripts/retrieval-bench
          if python3 pin-corpus.py --from ../../skills --out corpus/v1 \
               --exclude torchship --check
          then
            echo "pinned corpus matches skills/"
          else
            {
              echo "### Pinned corpus is behind \`skills/\`"
              echo
              echo "Scores here reflect \`corpus/v1\`, not the current tree."
              echo "To re-pin, in its own commit:"
              echo
              echo '```sh'
              echo 'cd scripts/retrieval-bench'
              echo './pin-corpus.py --from ../../skills --out corpus/v1 --exclude torchship'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch the results branch
        run: |
          git fetch origin bench-results:bench-results 2>/dev/null \
            && echo "results branch found" \
            || echo "no results branch yet; it will be created"

      - name: Check the harness itself
        # The harness must build both with and without the toolret feature: a
        # revision predating the group table has no table to lift. This was
        # broken once, and the symptom was 72 of 104 commits reporting as
        # "could not be measured" rather than as a bug here.
        env:
          RETRIEVAL_BENCH_WORK: ${{ github.workspace }}/bench-work
        run: ./scripts/retrieval-bench/selftest.sh

      - name: Run the benchmark
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THETIS_EMBED_BASE: ${{ vars.THETIS_EMBED_BASE }}
          RETRIEVAL_BENCH_WORK: ${{ github.workspace }}/bench-work
        run: |
          set -euo pipefail
          mkdir -p bench-work

          # Carry forward the existing series, so the chart shows history rather
          # than only this run.
          if git rev-parse --verify bench-results >/dev/null 2>&1; then
            git show bench-results:results.jsonl > bench-work/results.jsonl 2>/dev/null || : > bench-work/results.jsonl
          else
            : > bench-work/results.jsonl
          fi
          echo "existing datapoints: $(wc -l < bench-work/results.jsonl)"

          # `|| true` on each test: under `set -e` a bare `[[ ]] && cmd` whose
          # test is false makes the whole list return 1.
          ARGS=()
          if [[ "${{ inputs.lexical }}" == "true" ]]; then ARGS+=(--lexical); fi

          if [[ -n "${{ inputs.rev_range }}" ]]; then
            ARGS+=(--rev "${{ inputs.rev_range }}")
          elif [[ -n "${{ inputs.last }}" ]]; then
            ARGS+=(--last "${{ inputs.last }}")
          fi

          # `${ARGS[@]+...}` guards the expansion: under `set -u`, an empty
          # array expands to an unbound-variable error on older bash.
          ./scripts/retrieval-bench/run.sh \
            --out bench-work/results.jsonl \
            ${ARGS[@]+"${ARGS[@]}"} 2>&1 | tee bench-work/run.log

      # The headline measurement: what is each mechanism worth, with a
      # significance test on every delta. Runs on the small pinned corpus by
      # default because that needs no download and no API spend; the 9.5k-doc
      # external corpus is opt-in via the `full_ablation` input, since embedding
      # it costs real money on a cold cache.
      - name: Ablate the retrieval mechanisms
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          THETIS_EMBED_BASE: ${{ vars.THETIS_EMBED_BASE }}
          RETRIEVAL_BENCH_WORK: ${{ github.workspace }}/bench-work
          ABLATE_OUT: ${{ github.workspace }}/bench-work
        run: |
          set -euo pipefail
          ABL=(--skills-only)
          if [[ "${{ inputs.full_ablation }}" == "true" ]]; then ABL=(); fi

          ./scripts/retrieval-bench/ablate.sh "${ABL[@]+"${ABL[@]}"}" \
            2>&1 | tee bench-work/ablate.log

          {
            echo "## Ablation — what each mechanism is worth"
            echo
            echo 'Every delta carries a paired-bootstrap 95% CI. `ns` means the'
            echo 'interval includes zero: no effect detected at this sample size.'
            echo
            echo '```'
            sed -n '/^arm /,/^$/p' bench-work/ablate.log | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Chart and summarise
        run: |
          set -euo pipefail
          ./scripts/retrieval-bench/plot.py bench-work/results.jsonl \
            --out bench-work/results.svg > bench-work/table.txt
          cat bench-work/table.txt

          {
            echo '## Retrieval benchmark'
            echo
            echo '```'
            cat bench-work/table.txt
            echo '```'
            echo
            echo '<details><summary>Run log</summary>'
            echo
            echo '```'
            grep -vE '^\s+(\||=)' bench-work/run.log | tail -60 || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the chart
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-bench-${{ github.sha }}
          path: |
            bench-work/results.svg
            bench-work/results.jsonl
            bench-work/table.txt
          retention-days: 90

      - name: Comment the result on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('bench-work/table.txt', 'utf8');
            const body = [
              '## Retrieval benchmark',
              '',
              'Chart is in the run artifacts.',
              '',
              '```',
              table.trim(),
              '```',
            ].join('\n');

            // Update one comment rather than adding a new one per push, so a
            // long-running PR does not accumulate a wall of near-identical
            // benchmark reports.
            const marker = '## Retrieval benchmark';
            const existing = (await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })).data.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Only a real push to a tracked branch records a datapoint. A PR run
      # reports but does not append: the commits it measures may never land, and
      # a series containing them would chart a history that does not exist.
      - name: Record the datapoint
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          WORK="$(mktemp -d)"
          cp bench-work/results.jsonl bench-work/results.svg bench-work/table.txt "$WORK/"

          # An orphan branch, recreated each time: the results file is rewritten
          # wholesale, so keeping its history would store a copy of the entire
          # series per run for no benefit.
          git checkout --orphan bench-results-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          git clean -fdx --exclude=bench-work >/dev/null 2>&1 || true

          cp "$WORK/results.jsonl" "$WORK/results.svg" "$WORK/table.txt" .

          cat > README.md <<'EOF'
          # Retrieval benchmark results

          Generated by `.github/workflows/retrieval-bench.yml`. Do not edit by hand.

          - `results.jsonl` — one datapoint per line, schema 1. Appendable.
          - `results.svg` — the chart. Solid lines are dense ranking, dashed are
            the BM25 fallback; the two are never joined, because they measure
            different code paths and differ by roughly 0.3 nDCG on this corpus.
          - `table.txt` — the same numbers as text.

          To read the series locally:

              git show bench-results:results.jsonl > /tmp/results.jsonl
              ./scripts/retrieval-bench/plot.py /tmp/results.jsonl

          To add historical datapoints, run the workflow manually with a
          `rev_range` such as `HEAD~20..HEAD`, or locally:

              ./scripts/retrieval-bench/run.sh --last 20 --out /tmp/results.jsonl
          EOF

          git add results.jsonl results.svg table.txt README.md
          git commit -m "bench: $(git rev-parse --short ${{ github.sha }}) ($(wc -l < results.jsonl) datapoints)" \
            || { echo "nothing to record"; exit 0; }
          git push --force origin bench-results-new:bench-results
          echo "pushed $(wc -l < results.jsonl) datapoint(s) to bench-results"
