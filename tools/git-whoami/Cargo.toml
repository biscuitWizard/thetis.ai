[package]
name = "git-whoami"
version = "0.1.0"
edition = "2021"

# Standalone: built for wasm32-wasip2 by the orchestrator, not by the host
# workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.60"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rsa = { version = "0.9", features = ["sha2"] }
waki = "0.5"
base64 = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = "s"
