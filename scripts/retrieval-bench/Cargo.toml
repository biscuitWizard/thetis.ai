[package]
name = "retrieval-bench"
version = "0.0.0"
edition = "2021"
default-run = "retrieval-bench"

# Detached from the host workspace on purpose. This crate is compiled inside a
# throwaway worktree of an arbitrary past revision, where the workspace manifest
# may not even list the same members.
[workspace]

[dependencies]
# Required by the lifted orchestrator source, not by the harness itself.
anyhow = "1"
toml = "1"
tracing = "0.1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

# Blocking on purpose: the harness makes a handful of sequential requests and
# has no other reason to drag in an async runtime.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

[dev-dependencies]
# The lifted files bring their own test modules, which the orchestrator runs
# with tempfile. Supplying it means `cargo test` here also runs the real ranker's
# own unit tests against the revision under measurement -- a free correctness
# check on the thing being benchmarked.
tempfile = "3"

[features]
# The tool-group table only exists from the revision that introduced
# agents/agent-core/src/groups.rs onward. The runner enables this when the
# extractor found a table to lift, so an older revision still measures SkillRet
# instead of failing to compile.
toolret = []
